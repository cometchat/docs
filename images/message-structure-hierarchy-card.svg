<svg viewBox="0 0 1366 800" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L4,6 L7,1" fill="none" stroke="#BFC3C9" stroke-width="1.4"/>
    </marker>
  </defs>

  <!-- ===== connectors ===== -->
  <g fill="none" stroke="#BFC3C9" stroke-width="1.4">
    <!-- root -> category bus -->
    <path d="M702,108 L702,162"/>
    <path d="M140,162 L1215,162"/>
    <path d="M140,162 L140,213" marker-end="url(#arrow)"/>
    <path d="M367,162 L367,213" marker-end="url(#arrow)"/>
    <path d="M594,162 L594,213" marker-end="url(#arrow)"/>
    <path d="M918,162 L918,213" marker-end="url(#arrow)"/>
    <path d="M1215,162 L1215,213" marker-end="url(#arrow)"/>

    <!-- message -> types -->
    <path d="M140,253 L140,334" marker-end="url(#arrow)"/>

    <!-- action -> types -->
    <path d="M594,253 L594,300"/>
    <path d="M488,300 L674,300"/>
    <path d="M488,300 L488,334" marker-end="url(#arrow)"/>
    <path d="M674,300 L674,334" marker-end="url(#arrow)"/>
    <path d="M488,370 L488,388" marker-end="url(#arrow)"/>
    <path d="M674,370 L674,388" marker-end="url(#arrow)"/>

    <!-- call -> types -->
    <path d="M918,253 L918,300"/>
    <path d="M849,300 L1024,300"/>
    <path d="M849,300 L849,334" marker-end="url(#arrow)"/>
    <path d="M1024,300 L1024,334" marker-end="url(#arrow)"/>
    <!-- call -> status -->
    <path d="M1024,370 L1024,400 L936,400 L936,428" marker-end="url(#arrow)"/>

    <!-- card (leaf, no types) -->
  </g>

  <!-- ===== branch labels ===== -->
  <g fill="#2B2B2B" font-size="13">
    <text x="428" y="146">Category</text>
    <text x="165" y="289">Type</text>
    <text x="686" y="289">Type</text>
    <text x="1027" y="289">Type</text>
    <text x="556" y="389">Action</text>
    <text x="948" y="421">status</text>
  </g>

  <!-- ===== root + categories (rectangles) ===== -->
  <g font-size="14" fill="#ffffff" text-anchor="middle">
    <g>
      <rect x="627" y="70" width="150" height="38" rx="5" fill="#7C3AED"/>
      <text x="702" y="93" dominant-baseline="middle">Message</text>
    </g>
    <g>
      <rect x="65" y="215" width="150" height="38" rx="5" fill="#7C3AED"/>
      <text x="140" y="238" dominant-baseline="middle">message</text>
    </g>
    <g>
      <rect x="292" y="215" width="150" height="38" rx="5" fill="#7C3AED"/>
      <text x="367" y="238" dominant-baseline="middle">custom</text>
    </g>
    <g>
      <rect x="519" y="215" width="150" height="38" rx="5" fill="#7C3AED"/>
      <text x="594" y="238" dominant-baseline="middle">action</text>
    </g>
    <g>
      <rect x="843" y="215" width="150" height="38" rx="5" fill="#7C3AED"/>
      <text x="918" y="238" dominant-baseline="middle">call</text>
    </g>
    <g>
      <rect x="1140" y="215" width="150" height="38" rx="5" fill="#7C3AED"/>
      <text x="1215" y="238" dominant-baseline="middle">card</text>
    </g>
  </g>

  <!-- ===== type / value pills ===== -->
  <g font-size="13" fill="#ffffff" text-anchor="middle">
    <!-- message types -->
    <g><rect x="93" y="334" width="95" height="36" rx="18" fill="#9D5CFF"/><text x="140" y="352" dominant-baseline="middle">text</text></g>
    <g><rect x="93" y="388" width="95" height="36" rx="18" fill="#9D5CFF"/><text x="140" y="406" dominant-baseline="middle">image</text></g>
    <g><rect x="93" y="441" width="95" height="36" rx="18" fill="#9D5CFF"/><text x="140" y="459" dominant-baseline="middle">audio</text></g>
    <g><rect x="93" y="495" width="95" height="36" rx="18" fill="#9D5CFF"/><text x="140" y="513" dominant-baseline="middle">video</text></g>
    <g><rect x="93" y="549" width="95" height="36" rx="18" fill="#9D5CFF"/><text x="140" y="567" dominant-baseline="middle">file</text></g>

    <!-- action: groupMember column -->
    <g><rect x="423" y="334" width="130" height="36" rx="18" fill="#9D5CFF"/><text x="488" y="352" dominant-baseline="middle">groupMember</text></g>
    <g><rect x="423" y="388" width="130" height="36" rx="18" fill="#9D5CFF"/><text x="488" y="406" dominant-baseline="middle">joined</text></g>
    <g><rect x="423" y="442" width="130" height="36" rx="18" fill="#9D5CFF"/><text x="488" y="460" dominant-baseline="middle">left</text></g>
    <g><rect x="423" y="496" width="130" height="36" rx="18" fill="#9D5CFF"/><text x="488" y="514" dominant-baseline="middle">kicked</text></g>
    <g><rect x="423" y="550" width="130" height="36" rx="18" fill="#9D5CFF"/><text x="488" y="568" dominant-baseline="middle">banned</text></g>
    <g><rect x="423" y="604" width="130" height="36" rx="18" fill="#9D5CFF"/><text x="488" y="622" dominant-baseline="middle">unbanned</text></g>
    <g><rect x="423" y="658" width="130" height="36" rx="18" fill="#9D5CFF"/><text x="488" y="676" dominant-baseline="middle">added</text></g>
    <g><rect x="423" y="712" width="130" height="36" rx="18" fill="#9D5CFF"/><text x="488" y="730" dominant-baseline="middle">scopeChanged</text></g>

    <!-- action: message column -->
    <g><rect x="627" y="334" width="95" height="36" rx="18" fill="#9D5CFF"/><text x="674" y="352" dominant-baseline="middle">message</text></g>
    <g><rect x="627" y="388" width="95" height="36" rx="18" fill="#9D5CFF"/><text x="674" y="406" dominant-baseline="middle">edited</text></g>
    <g><rect x="627" y="442" width="95" height="36" rx="18" fill="#9D5CFF"/><text x="674" y="460" dominant-baseline="middle">deleted</text></g>

    <!-- call: types -->
    <g><rect x="802" y="334" width="95" height="36" rx="18" fill="#9D5CFF"/><text x="849" y="352" dominant-baseline="middle">audio</text></g>
    <g><rect x="969" y="334" width="110" height="36" rx="18" fill="#9D5CFF"/><text x="1024" y="352" dominant-baseline="middle">video</text></g>

    <!-- call: status -->
    <g><rect x="871" y="428" width="130" height="36" rx="18" fill="#9D5CFF"/><text x="936" y="446" dominant-baseline="middle">initiated</text></g>
    <g><rect x="871" y="482" width="130" height="36" rx="18" fill="#9D5CFF"/><text x="936" y="500" dominant-baseline="middle">ongoing</text></g>
    <g><rect x="871" y="536" width="130" height="36" rx="18" fill="#9D5CFF"/><text x="936" y="554" dominant-baseline="middle">rejected</text></g>
    <g><rect x="871" y="590" width="130" height="36" rx="18" fill="#9D5CFF"/><text x="936" y="608" dominant-baseline="middle">cancel</text></g>
    <g><rect x="871" y="644" width="130" height="36" rx="18" fill="#9D5CFF"/><text x="936" y="662" dominant-baseline="middle">busy</text></g>
    <g><rect x="871" y="698" width="130" height="36" rx="18" fill="#9D5CFF"/><text x="936" y="716" dominant-baseline="middle">unanswered</text></g>
    <g><rect x="871" y="752" width="130" height="36" rx="18" fill="#9D5CFF"/><text x="936" y="770" dominant-baseline="middle">ended</text></g>
  </g>
</svg>
