# docs-parity feature map
#
# Platform path conventions differ and cannot be inferred, so every feature declares its
# pages explicitly. Keys under `pages:` are platform ids; values are repo-relative paths.
#
#   pages:         the page for this feature on that platform
#   sections:      platform documents the feature as a SECTION of another page, not its own
#                  page. Value is <path>#<anchor>. Prevents a false "missing page" forever.
#   accepted-gaps: platform genuinely has no docs for this feature, and that is known and
#                  accepted. Suppressed from the report body; listed once in a footer line.
#
# Editing an accepted-gap entry is how a gap gets closed: delete the line, and the next run
# starts reporting it.
#
# All paths below verified present on origin/main as of 2026-09-15.

features:
  pinned-messages:
    pages:
      ios:          ui-kit/ios/pinned-messages.mdx
      android:      ui-kit/android/pinned-messages.mdx
      react:        ui-kit/react/components/pinned-messages.mdx
      react-native: ui-kit/react-native/pinned-messages.mdx
      angular:      ui-kit/angular/components/cometchat-pinned-messages.mdx
    accepted-gaps:
      flutter: "Not shipped on Flutter as of 2026-09-15"
      vue:     "Vue kit is the legacy v2/v3 page set"

  saved-messages:
    pages:
      ios:          ui-kit/ios/saved-messages.mdx
      android:      ui-kit/android/saved-messages.mdx
      react:        ui-kit/react/components/saved-messages.mdx
      react-native: ui-kit/react-native/saved-messages.mdx
      angular:      ui-kit/angular/components/cometchat-saved-messages.mdx
    accepted-gaps:
      flutter: "Not shipped on Flutter as of 2026-09-15"
      vue:     "Vue kit is the legacy v2/v3 page set"

  pin-save-guide:
    pages:
      ios:     ui-kit/ios/guide-pin-save-message.mdx
      android: ui-kit/android/guide-pin-and-save-messages.mdx
      react:   ui-kit/react/guide-pin-and-save-messages.mdx
      angular: ui-kit/angular/guides/pin-and-save-messages.mdx
    accepted-gaps:
      react-native: "Has the component pages but no guide"
      flutter:      "Not shipped on Flutter as of 2026-09-15"
      vue:          "Vue kit is the legacy v2/v3 page set"

  threaded-messages-guide:
    pages:
      ios:          ui-kit/ios/guide-threaded-messages.mdx
      android:      ui-kit/android/guide-threaded-messages.mdx
      react:        ui-kit/react/guide-threaded-messages.mdx
      react-native: ui-kit/react-native/guide-threaded-messages.mdx
      flutter:      ui-kit/flutter/guide-threaded-messages.mdx
      angular:      ui-kit/angular/guides/threaded-messages.mdx
    accepted-gaps:
      vue: "Vue covers threads in a single legacy page"

  threaded-messages-header:
    pages:
      ios:          ui-kit/ios/threaded-messages-header.mdx
      android:      ui-kit/android/threaded-messages-header.mdx
      react:        ui-kit/react/components/thread-header.mdx
      react-native: ui-kit/react-native/threaded-messages-header.mdx
      flutter:      ui-kit/flutter/threaded-messages-header.mdx
      angular:      ui-kit/angular/components/cometchat-thread-header.mdx
    accepted-gaps:
      vue: "Vue covers threads in a single legacy page"

  thread-subscription:
    pages:
      android: ui-kit/android/guide-thread-subscription.mdx
      angular: ui-kit/angular/guides/thread-subscription.mdx
    sections:
      # iOS deliberately deleted its standalone guide (84c9e7df) and redirected to a
      # section; docs.json carries the redirect. React documents it inside thread-header.
      ios:   ui-kit/ios/guide-threaded-messages.mdx#thread-subscription
      react: ui-kit/react/components/thread-header.mdx#thread-subscription
    accepted-gaps:
      react-native: "Not documented"
      flutter:      "Not documented"
      vue:          "Vue kit is the legacy v2/v3 page set"
